# a2a/07: docker-compose для локальной разработки / smoke.
#
# Сервисы:
#   agent  — A2A-сервер (LLM), EXPOSE 8080, /health
#   mcp    — MCP-сервер (stdio) — для клиентов, не для HTTP
#
# Данные (`./data`, `./outputs`) монтируются read-write на оба сервиса
# (MCP читает то, что материализовал агент; либо — в MAS-цепочке,
# upstream-агент сам пишет в data/ через agent-tool).
#
# CHAT_URL/API_KEY берутся из .env (НЕ в compose).

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: blocksnet-agent/agent:latest
    container_name: blocksnet-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Данные городов — общий volume для обоих сервисов.
      - ./data:/app/data:rw
      - ./outputs:/app/outputs:rw
    env_file:
      - .env
    environment:
      - A2A_HOST=0.0.0.0
      - A2A_PORT=8080
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/outputs
      # a2a/06 — по умолчанию auth выключен (локальная dev-среда).
      - A2A_AUTH_ENABLED=${A2A_AUTH_ENABLED:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Агент держит GeoDataFrame + матрицу доступности (сотни МБ).
    mem_limit: 4g
    cpus: 2.0

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: blocksnet-agent/mcp:latest
    container_name: blocksnet-mcp
    restart: unless-stopped
    # stdio-транспорт — без ports.
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data:rw
      - ./outputs:/app/outputs:rw
    environment:
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/outputs
      - MAX_SESSIONS=8
      - SESSION_TTL_SEC=1800
      # LLM-переменные НЕ передаём — MCP их не требует.
    # Healthcheck через Python import — stdio MCP так не проверить.
    healthcheck:
      test: ["CMD", "python", "-c", "import blocksnet_mcp.server; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 2g
    cpus: 1.0

networks:
  default:
    name: blocksnet-net